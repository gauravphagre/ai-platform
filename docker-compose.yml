services:

  ollama:
    build: ./ollama
    image: ai-ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ai-net

  backend:
    build: ./backend
    image: ai-backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - ai-net

  frontend:
    build: ./frontend
    image: ai-frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-net

  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    volumes:
      - ./security/trivy/reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
      - ./security/scan.sh:/scan.sh
    entrypoint: [ "/bin/sh", "/scan.sh" ]
    networks:
      - ai-net

  security-exporter:
    build:
      context: ./security
    container_name: security-exporter
    volumes:
      - ./security/trivy/reports:/reports
    ports:
      - "9110:9110"
    networks:
      - ai-net

  load-tester:
    build: ./load-test
    profiles:
      - loadtest
    depends_on:
      - backend
    networks:
      - ai-net

  postgres:
    image: postgres:16
    container_name: ai-platform-postgres
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-net

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-net

networks:
  ai-net:
    external: true

volumes:
  postgres_data:
  qdrant_data: