services:

  ollama:
    build: ./ollama
    image: ai-ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    runtime: nvidia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-net

  backend:
    build: ./backend
    image: ai-backend
    container_name: ai-backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - postgres
      - qdrant
      - redis
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_URL=postgresql://ai_user:ai_password@postgres:5432/ai_platform
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-net

  worker:
    build: ./backend
    image: ai-worker
    container_name: ai-worker
    depends_on:
      - redis
      - postgres
      - qdrant
      - ollama
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_URL=postgresql://ai_user:ai_password@postgres:5432/ai_platform
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    command: >
      python -m app.runtime.workers.worker_manager
    restart: unless-stopped
    networks:
      - ai-net

  frontend:
    build: ./frontend
    image: ai-frontend
    container_name: ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-net

  postgres:
    image: postgres:16
    container_name: ai-platform-postgres
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_platform"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-net

  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-net

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - ai-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - observability
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ai-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    profiles:
      - observability
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - ai-net

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    profiles:
      - observability
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
    command: [ "-config.file=/etc/tempo.yaml" ]
    restart: unless-stopped
    networks:
      - ai-net

  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    profiles:
      - security
    volumes:
      - ./security/trivy/reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
      - ./security/scan.sh:/scan.sh
    entrypoint: ["/bin/sh", "/scan.sh"]
    restart: "no"
    networks:
      - ai-net

  security-exporter:
    build:
      context: ./security
    container_name: security-exporter
    profiles:
      - security
    volumes:
      - ./security/trivy/reports:/reports
    ports:
      - "9110:9110"
    restart: unless-stopped
    networks:
      - ai-net

  load-tester:
    build: ./load-test
    container_name: ai-load-tester
    profiles:
      - loadtest
    depends_on:
      - backend
    restart: "no"
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  grafana_data: