global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "otel"
    static_configs:
      - targets: ["otel:8889"]

  - job_name: "backend"
    static_configs:
      - targets: [ "backend:8000" ]

  - job_name: 'security'
    static_configs:
      - targets: [ 'security-exporter:9110' ]